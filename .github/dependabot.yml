# Keeps SHA-pinned actions from rotting: Dependabot understands `uses: owner/repo@<sha> # vX.Y.Z`
# and bumps the SHA and the version comment together in one PR, which still goes through CI
# and review like any other change. Maven deps get added here at G3 (SCA).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Supply-chain cooldown: don't adopt a release until it has been public for a week, so a
    # hijacked release is likely caught and yanked before we pull it in.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # G3 (SCA): Maven version updates. This is the *preventive* half; osv-scanner in CI is the
  # *detective* half. Security updates (fixes for known CVEs) are enabled in repo settings and
  # ignore the cooldown, since a known-vulnerable version shouldn't wait a week.
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30 # majors (e.g. Boot 5) need a planned migration, not a drive-by bump
    groups:
      spring-boot:
        patterns: ["org.springframework.boot:*"]
      maven-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build

  # G3 (SCA): npm for the frontend, same idea as Maven. Without this entry the frontend got no
  # version PRs at all (found 2026-10-16, Next.js advisories). Next.js and its lint config move
  # together; React and its types together; the rest grouped by update type.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-minor-patch:
        update-types: [minor, patch]
    # @types/node follows the Node runtime major (22, frontend/Dockerfile): newer types let code use
    # APIs that don't exist at runtime. TypeScript majors are planned migrations (7 broke CI).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build

  # M5: base images in backend/Dockerfile are pinned by digest, which also means they never pick
  # up OS security fixes by themselves (a stale "minimal" image is how CVEs pile up). Dependabot
  # proposes digest bumps weekly; the image scan in CI judges each one like any other change.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3 # base images are mostly security rebuilds; a short wait still beats a hijack
    # Runtime majors (Java, Node) are planned migrations, not drive-by bumps. The runtime stage
    # names its major in the image itself (distroless/java21, nodejs22), which Dependabot can't
    # move, so bumping only the build stage would compile for a runtime we don't ship (JDK 25
    # class files fail on a Java 21 runtime). Digest and patch updates, which carry the OS
    # security fixes, still come weekly.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: build
