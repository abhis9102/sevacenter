name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily rescan of main: new CVEs are published every day and Semgrep registry rules change,
  # so unchanged code gains findings. This is how SCA/SAST tickets get raised for main.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

# Default for every job: no token permissions at all. Each job opts in to exactly what it
# needs, so a compromised step can't push code, open releases, or edit PRs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA (tags are mutable — see the
# tj-actions/changed-files compromise, March 2025). The trailing comment is the human-readable
# version; Dependabot (.github/dependabot.yml) bumps both together.
jobs:
  build:
    name: Build & test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung job shouldn't burn runner minutes for 6h (the default)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker, which Testcontainers needs.
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B -ntp verify
      # The jar and the SBOM Maven generated for it (cyclonedx-maven-plugin, see pom.xml) are
      # handed to the sbom/attest jobs, so they check and sign exactly what was built here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-build
          path: |
            backend/target/backend-*.jar
            backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error
          retention-days: 14

  # The staff admin app (Next.js). Node 22 LTS. Supply chain first: install exactly the
  # lockfile with install scripts off (the classic npm attack path), then verify registry
  # signatures/provenance. No dependency cache: a cache shared across runs can be poisoned,
  # and a clean install is ~30 s.
  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install exactly the lockfile, no install scripts
        run: npm ci --ignore-scripts
      - name: Verify registry signatures and provenance attestations
        run: npm audit signatures
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit in the push/PR, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Read-only use: on pull_request the action lists the PR's commits via the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need pull-requests: write; findings show in the job log instead.
          GITLEAKS_ENABLE_COMMENTS: "false"

  workflow-lint:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Static analysis of .github/workflows itself: script injection via ${{ }} in run:,
      # dangerous triggers (pull_request_target), unpinned actions, over-broad permissions.
      # advanced-security: false → plain pass/fail gate, no SARIF upload / write perms needed.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (Security tab + PR annotations)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same rulesets as the pre-commit hook: one policy, two enforcement points.
      # The image is pinned by digest (= semgrep 1.179.0). It's Alpine, so it can't be the job
      # `container:` (JS actions like checkout need glibc); call it with docker run instead.
      # No --error: this job reports, the ruleset's code_scanning rule decides what blocks.
      - name: Semgrep scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --config p/java --config p/python --config p/typescript --config p/react \
              --config p/nextjs --config p/secrets \
              --metrics=off --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: SCA (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    env:
      OSV_IMAGE: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accepted-risk policy (every ignore has a reason + expiry)
        run: python3 tools/security/sca_policy.py ignores osv-scanner.toml
      # osv-scanner resolves Maven's transitive tree itself (no build needed). The repo is
      # mounted at the runner's own path so the SARIF's absolute file URIs map back onto it.
      # Exit codes: 0 clean, 1 vulnerabilities found (the severity gate step decides what
      # blocks), 128 nothing scanned, anything else broken. Only 0 and 1 are acceptable.
      - name: Scan dependencies
        run: |
          scan() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" "$OSV_IMAGE" \
              scan source -r --config osv-scanner.toml "$@" .
          }
          rc=0; scan --format sarif --output-file osv.sarif || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed or scanned nothing (exit $rc)"; exit "$rc"; fi
          rc=0; scan --format json --all-packages --output-file osv-all.json || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed or scanned nothing (exit $rc)"; exit "$rc"; fi
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: osv.sarif
          category: osv-scanner
      # Partial resolution reports "0 vulnerabilities" for what it never saw. Fail on it.
      - name: Coverage (every declared dependency was resolved)
        run: python3 tools/security/sca_policy.py coverage osv-all.json $(git ls-files '*pom.xml' '*package.json')
      # The blocking decision lives here, not in the ruleset's code_scanning rule: GitHub only
      # blocks alerts on lines a PR changed, and osv-scanner reports findings at pom.xml:1.
      - name: Severity gate (block CVSS >= 7.0 unless an accepted risk)
        run: python3 tools/security/sca_policy.py gate osv-all.json --fail-at 7.0

  sbom:
    name: SBOM (CycloneDX)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OSV_IMAGE: ghcr.io/google/osv-scanner@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa # v2.6.0
      SBOM: build/classes/META-INF/sbom/application.cdx.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: build
      - name: Validate SBOM (format, subject, every component has purl + version)
        run: python3 tools/security/sbom_check.py validate "$SBOM"
      # Scan what Maven actually ships (the SBOM), plus the pom the way G3 sees it, for drift.
      - name: Scan shipped components
        run: |
          scan() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:$PWD" -w "$PWD" "$OSV_IMAGE" \
              scan source --config osv-scanner.toml --format json --all-packages "$@"
          }
          rc=0; scan --output-file osv-sbom.json -L "$SBOM" || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed on the SBOM (exit $rc)"; exit "$rc"; fi
          rc=0; scan --output-file osv-pom.json -r backend || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::osv-scanner failed on the pom (exit $rc)"; exit "$rc"; fi
      - name: Severity gate on shipped components (CVSS >= 7.0)
        run: python3 tools/security/sca_policy.py gate osv-sbom.json --fail-at 7.0
      - name: Drift (everything we ship was also seen by the G3 scan)
        run: python3 tools/security/sbom_check.py drift "$SBOM" osv-pom.json

  # G6: the container images that ship (backend + frontend, ADR 0031) and their Dockerfiles.
  # Same script locally (`make image-scan`). Policy: docs/security/image-scan.md. Fixable
  # Critical/High block; unfixable ones go to code scanning and are re-checked by the daily run.
  # G7: the Terraform under infra/, with Checkov + our custom checks (.checkov/checks). Same script
  # locally (`make iac-scan`). Policy: docs/security/iac-scan.md. A self-test on a deliberately
  # insecure fixture runs first; then every failed check blocks unless accepted with a reason +
  # expiry (open-source Checkov has no severities to draw a line on).
  iac:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Self-test, scan, gate
        run: tools/security/iac_scan.sh iac-scan
      # Only the real infrastructure goes to code scanning, never the fixture.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && hashFiles('iac-scan/infra/results_sarif.sarif') != '' }}
        with:
          sarif_file: iac-scan/infra/results_sarif.sarif
          category: checkov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: iac-scan
          path: iac-scan/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dockerfile scan, image build, image scan, coverage, gate
        run: tools/security/image_scan.sh image-scan
      # Every finding, unfixable ones included, stays visible in the Security tab.
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && hashFiles('image-scan/trivy-backend.sarif') != '' }}
        with:
          sarif_file: image-scan/trivy-backend.sarif
          category: trivy-image # backend; name kept so its existing alerts carry on
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: ${{ !cancelled() && hashFiles('image-scan/trivy-frontend.sarif') != '' }}
        with:
          sarif_file: image-scan/trivy-frontend.sarif
          category: trivy-image-frontend
      # The image's own SBOM: OS packages included, which the jar's SBOM (G4) can't see.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: image-scan
          path: |
            image-scan/trivy-*.json
            image-scan/*.cdx.json
          if-no-files-found: warn
          retention-days: 14

  # Attacks the running app: the jar from `build` + a throwaway Postgres, ZAP active API scan.
  # Same script locally (`make dast`). Active scanning only ever targets this ephemeral env.
  dast:
    name: DAST (ZAP)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30 # probe + two ZAP passes (~8 min locally)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: build
      - name: ZAP scan of the built jar (fails if the attacks never reached the database)
        run: tools/security/dast.sh build/backend-*.jar dast-out
      - name: Policy gate (Medium+ blocks; Low becomes a ticket on main)
        run: python3 tools/security/dast_policy.py gate dast-out/zap-authed.json dast-out/zap.json --out dast-out/findings.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: dast-report # zap[-authed].html/.json, authz-probe.json, findings.json, app.log
          path: dast-out/
          retention-days: 14

  # Signs, never builds: binds SLSA build provenance and the SBOM to the jar's digest with a
  # keyless Sigstore certificate. Verify with `gh attestation verify <jar> -R <owner>/<repo>`.
  # Public repo -> entries go to the public Rekor transparency log (repo, workflow, commit).
  attest:
    name: Attest build (provenance + SBOM)
    needs: [build, sbom]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # mint the OIDC token exchanged for a short-lived signing certificate
      attestations: write # store the attestations on this repository
      # artifact-metadata: write is only for registry images (storage records), not needed here.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-build
          path: build
      - name: Build provenance (SLSA)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/backend-*.jar
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/backend-*.jar
          sbom-path: build/classes/META-INF/sbom/application.cdx.json

  # --- Ticketing (tools/security/tickets.py; policy in docs/security/ticketing.md) ----------
  # These are the only jobs that can write issues, and they never run a scanner. The ticket
  # script is checked out from the default branch, not from the PR: code under test must not
  # be able to change the tooling that holds a write token.

  secret-tickets:
    name: Ticket leaked secrets
    needs: secrets-scan
    # A pushed secret is leaked whether or not the PR merges, so this runs on PRs too.
    if: ${{ always() && needs.secrets-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create the secret-leak ticket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-results.sarif # redacted report uploaded by gitleaks-action
          path: gitleaks-report
      - name: Open tickets
        run: python3 tools/security/tickets.py secrets gitleaks-report
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dast-tickets:
    name: Sync DAST tickets (main)
    needs: dast
    # Runs even if the gate failed on main (e.g. a new ZAP rule in the daily scan), so the
    # finding gets an owner; PR findings block the merge instead.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create / reopen / close DAST tickets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dast-report
          path: dast-report
      - name: Sync tickets with unaccepted findings
        run: python3 tools/security/tickets.py dast dast-report/findings.json
        env:
          GITHUB_TOKEN: ${{ github.token }}

  code-scanning-tickets:
    name: Sync code scanning tickets (main)
    needs: [sast, sca]
    # PR findings block the merge instead; only what's on main needs an owner + ticket.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read # list code scanning alerts
      issues: write # create / reopen / close SAST + SCA tickets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync tickets with open alerts
        run: python3 tools/security/tickets.py code-scanning --ref refs/heads/main
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Next gates (roadmap "Security-gate track"): G6 image scan, G7 IaC + OIDC.
