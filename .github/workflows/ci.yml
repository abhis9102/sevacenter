name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly rescan of main: registry rules change even when our code doesn't, so new findings
  # can appear on unchanged code. This is how SAST tickets get raised for main.
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

# Default for every job: no token permissions at all. Each job opts in to exactly what it
# needs, so a compromised step can't push code, open releases, or edit PRs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every third-party action is pinned to a full commit SHA (tags are mutable — see the
# tj-actions/changed-files compromise, March 2025). The trailing comment is the human-readable
# version; Dependabot (.github/dependabot.yml) bumps both together.
jobs:
  build:
    name: Build & test (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a hung job shouldn't burn runner minutes for 6h (the default)
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # don't leave the token in .git/config for later steps
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker, which Testcontainers needs.
      - name: Build & test
        working-directory: backend
        run: ./mvnw -B -ntp verify

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: scan every commit in the push/PR, not just the tip
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Read-only use: on pull_request the action lists the PR's commits via the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments would need pull-requests: write; findings show in the job log instead.
          GITLEAKS_ENABLE_COMMENTS: "false"

  workflow-lint:
    name: Workflow security lint (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Static analysis of .github/workflows itself: script injection via ${{ }} in run:,
      # dangerous triggers (pull_request_target), unpinned actions, over-broad permissions.
      # advanced-security: false → plain pass/fail gate, no SARIF upload / write perms needed.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (Security tab + PR annotations)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same rulesets as the pre-commit hook: one policy, two enforcement points.
      # The image is pinned by digest (= semgrep 1.179.0). It's Alpine, so it can't be the job
      # `container:` (JS actions like checkout need glibc); call it with docker run instead.
      # No --error: this job reports, the ruleset's code_scanning rule decides what blocks.
      - name: Semgrep scan
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src" -w /src \
            semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b \
            semgrep scan --config p/java --config p/python --config p/secrets \
              --metrics=off --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # --- Ticketing (tools/security/tickets.py; policy in docs/security/ticketing.md) ----------
  # These are the only jobs that can write issues, and they never run a scanner. The ticket
  # script is checked out from the default branch, not from the PR: code under test must not
  # be able to change the tooling that holds a write token.

  secret-tickets:
    name: Ticket leaked secrets
    needs: secrets-scan
    # A pushed secret is leaked whether or not the PR merges, so this runs on PRs too.
    if: ${{ always() && needs.secrets-scan.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # create the secret-leak ticket
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gitleaks-results.sarif # redacted report uploaded by gitleaks-action
      - name: Open tickets
        run: python3 tools/security/tickets.py secrets results.sarif
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sast-tickets:
    name: Sync SAST tickets (main)
    needs: sast
    # PR findings block the merge instead; only what's on main needs an owner + ticket.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read # list code scanning alerts
      issues: write # create / reopen / close SAST tickets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync tickets with open alerts
        run: python3 tools/security/tickets.py code-scanning --ref refs/heads/main
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Next gates (roadmap "Security-gate track"): G3 SCA, G4 SBOM, G5 DAST (ZAP baseline),
  # G6 image scan, G7 IaC + OIDC.
