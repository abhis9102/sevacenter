name: cd-staging

# Continuous deployment to staging in ap-south-1 (ADR 0034). Runs on a push to main that touches
# the app (after the PR's CI gates passed), or on manual dispatch.
#
# 1. G6 scans the two images first, before any AWS credential exists in the job; the images
#    pushed are exactly the ones scanned, never a rebuild.
# 2. The deploy role (sevacenter-cd-staging, OIDC, main only) pushes them under immutable SHA tags,
#    mirrors Caddy and Mailpit into our ECR by digest, and pins every digest in SSM.
# 3. It runs the one SSM document it's allowed, on the box tagged as the app box. At night staging
#    is stopped (ADR 0032): the pins are set and the boxes pick them up at 08:00.
#
# Identifiers (registry, role, host names) are repository secrets: the repo and its logs are public
# and secrets are masked in logs.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "tools/security/image_scan.sh"
      - ".trivy/**"
      - ".github/workflows/cd-staging.yml"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  # Third-party images staging runs, mirrored by digest (the boxes pull only from our ECR).
  CADDY_IMAGE: caddy@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d # 2.10.2-alpine
  MAILPIT_IMAGE: axllent/mailpit@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68 # v1.27

jobs:
  deploy:
    name: Scan, push, deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      deployed: ${{ steps.redeploy.outputs.skipped != 'true' }}
    permissions:
      id-token: write # OIDC token for the deploy role
      contents: read
      actions: write # cancel a DAST scan running against the build being replaced
    env:
      ECR: ${{ secrets.STAGING_ECR_REGISTRY }}
      SMOKE_URLS: ${{ secrets.STAGING_SMOKE_URLS }} # space-separated
    steps:
      - name: Required configuration is present
        env:
          ROLE: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          for v in ECR SMOKE_URLS ROLE; do
            [ -n "${!v}" ] || { echo "::error::missing repository secret for $v"; exit 1; }
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image scan (G6) before push
        run: tools/security/image_scan.sh image-scan

      - name: AWS credentials via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.STAGING_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Push the scanned images and mirrors, pin digests
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::12}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR"
          pin() { aws ssm put-parameter --name "/sevacenter/staging/images/$1" --type String --overwrite --value "$2" >/dev/null; echo "pinned $1"; }
          # Push unless the (immutable) tag is already there; return the digest reference.
          push() {
            local src=$1 repo=$2 tag=$3
            if ! aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" >/dev/null 2>&1; then
              docker tag "$src" "$ECR/$repo:$tag"
              docker push -q "$ECR/$repo:$tag" >/dev/null
            fi
            echo "$ECR/$repo@$(aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          }
          for name in backend frontend; do
            pin "$name" "$(push "sevacenter-$name:scan" "sevacenter-$name" "$TAG")"
          done
          docker pull -q "$CADDY_IMAGE" >/dev/null && pin caddy "$(push "$CADDY_IMAGE" sevacenter-caddy "${CADDY_IMAGE##*sha256:}")"
          docker pull -q "$MAILPIT_IMAGE" >/dev/null && pin mailpit "$(push "$MAILPIT_IMAGE" sevacenter-mailpit "${MAILPIT_IMAGE##*sha256:}")"

      # A redeploy restarts the backend: a scan running across it gets 502s and loses its session
      # (the first staging scan did, 2026-10-15). Stop it; the scan started after this deploy
      # tests the new build from the start.
      - name: Stop a DAST scan that is running against the old build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow dast-staging.yml --status in_progress --json databaseId --jq '.[].databaseId'); do
            echo "cancelling DAST run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

      - name: Redeploy the app box (skipped while staging sleeps)
        id: redeploy
        run: |
          set -euo pipefail
          RUNNING=$(aws ec2 describe-instances \
            --filters Name=tag:sevacenter-role,Values=app Name=instance-state-name,Values=running \
            --query 'length(Reservations[].Instances[])' --output text)
          if [ "$RUNNING" = "0" ]; then
            echo "::notice::staging is stopped (night schedule); the new images start with it at 08:00 IST"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CID=$(aws ssm send-command --document-name sevacenter-staging-redeploy \
            --targets Key=tag:sevacenter-role,Values=app --query 'Command.CommandId' --output text)
          echo "command: $CID"
          st=Pending
          for _ in $(seq 1 80); do
            st=$(aws ssm list-command-invocations --command-id "$CID" --query 'CommandInvocations[0].Status' --output text 2>/dev/null || echo Pending)
            case "$st" in Success) break;; Failed|TimedOut|Cancelled) break;; esac
            sleep 5
          done
          aws ssm list-command-invocations --command-id "$CID" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text | tail -20
          [ "$st" = "Success" ] || { echo "::error::redeploy $st"; exit 1; }

      - name: Smoke test both brands
        if: steps.redeploy.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          for url in $SMOKE_URLS; do
            code=000
            for _ in $(seq 1 12); do  # the backend takes a minute to migrate and start
              code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "::error::smoke test failed for $url ($code)"; exit 1; }
          done

  # Attack what was just deployed (ADR 0035). Started as its own run, not called as a reusable
  # workflow: a called job didn't receive the staging-dast environment's secrets (DAST_TRUST came
  # through empty), and a top-level run keeps those secrets in that environment only.
  dast:
    name: Start DAST staging
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # workflow_dispatch of dast-staging.yml; GITHUB_TOKEN may start it
    steps:
      - name: Start the scan of what was just deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run dast-staging.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "### DAST staging started: Actions → dast-staging (findings on that run's summary)" >> "$GITHUB_STEP_SUMMARY"
