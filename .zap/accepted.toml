# Accepted DAST risks (G5). Policy: docs/security/dast.md
#
# Scope every entry to one ZAP rule (pluginId) AND a param and/or uri regex; whole-rule ignores
# are rejected. Each needs a reason (>= 20 chars: who decided, why it's acceptable) and an
# ignoreUntil no more than 90 days out. tools/security/dast_policy.py enforces all of it.
#
# Example:
# [[accepted]]
# pluginId = "10010"            # Cookie No HttpOnly Flag
# param = "XSRF-TOKEN"          # only this cookie
# ignoreUntil = 2026-12-31
# reason = "Abhi: by design (ADR 0007), the SPA must read the CSRF cookie; it is not a session credential."

[[accepted]]
pluginId = "100001" # Unexpected Content-Type
uri = '^https?://[^/?]+\?' # request target with no path, e.g. "GET ?a=b": malformed HTTP
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): Tomcat's connector rejects a request line with no path with a minimal HTML 400 before Spring runs; no version or details disclosed (verified). In M6 the ALB rejects these first. Re-check then."

[[accepted]]
pluginId = "40014" # Cross Site Scripting (Persistent)
uri = '/api/v1/devotees/export(\?|$)' # the CSV export only: stored names come back verbatim, as data
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): reproduced by hand: served as text/csv + Content-Disposition: attachment + nosniff, so browsers download it and never render it (ZAP itself: low confidence, not HTML). Defence in depth: API CSP default-src 'none'; sandbox. All pinned by DevoteeCsvTest + SecurityRegressionTest. Re-check when the frontend renders exports."

[[accepted]]
pluginId = "100001" # Unexpected Content-Type
uri = '/api/v1/devotees/export(\?|$)' # by design: the export is a CSV file, not JSON
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): the export endpoint deliberately returns text/csv (ADR 0010). ZAP expects JSON from an API. Content type, attachment and nosniff are pinned by DevoteeCsvTest."
