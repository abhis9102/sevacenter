# Accepted DAST risks (G5). Policy: docs/security/dast.md
#
# Scope every entry to one ZAP rule (pluginId) AND a param and/or uri regex; whole-rule ignores
# are rejected. Each needs a reason (>= 20 chars: who decided, why it's acceptable) and an
# ignoreUntil no more than 90 days out. tools/security/dast_policy.py enforces all of it.
#
# Example:
# [[accepted]]
# pluginId = "10010"            # Cookie No HttpOnly Flag
# param = "XSRF-TOKEN"          # only this cookie
# ignoreUntil = 2026-12-31
# reason = "Abhi: by design (ADR 0007), the SPA must read the CSRF cookie; it is not a session credential."

[[accepted]]
pluginId = "100001" # Unexpected Content-Type
uri = '^https?://[^/?]+\?' # request target with no path, e.g. "GET ?a=b": malformed HTTP
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): Tomcat's connector rejects a request line with no path with a minimal HTML 400 before Spring runs; no version or details disclosed (verified). In M6 the ALB rejects these first. Re-check then."

[[accepted]]
pluginId = "40014" # Cross Site Scripting (Persistent)
uri = '/api/v1/devotees/export(\?|$)' # the CSV export only: stored names come back verbatim, as data
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): reproduced by hand: served as text/csv + Content-Disposition: attachment + nosniff, so browsers download it and never render it (ZAP itself: low confidence, not HTML). Defence in depth: API CSP default-src 'none'; sandbox. All pinned by DevoteeCsvTest + SecurityRegressionTest. Re-check when the frontend renders exports."

[[accepted]]
pluginId = "100001" # Unexpected Content-Type
uri = '/api/v1/devotees/export(\?|$)' # by design: the export is a CSV file, not JSON
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): the export endpoint deliberately returns text/csv (ADR 0010). ZAP expects JSON from an API. Content type, attachment and nosniff are pinned by DevoteeCsvTest."

[[accepted]]
pluginId = "40014" # Cross Site Scripting Weakness (Persistent in JSON Response)
uri = '/api/v1/(public/)?(events|pujas|sevaks|donations)(\?|$)'
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): stored titles/names come back verbatim as JSON data (application/json, nosniff, API CSP default-src 'none'; sandbox); the frontend renders them as text (React escapes; no dangerouslySetInnerHTML). Pinned by SecurityRegressionTest + frontend review."

[[accepted]]
pluginId = "40018" # SQL Injection (boolean-based heuristic)
param = "name"
uri = '/api/v1/donation-funds(/[0-9]+)?$' # create and rename
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec): not injection. Fund names are unique per trust (uq_donation_fund_name); ZAP's earlier requests had already created funds named with its payloads, so creating or renaming to one of those gives 400 (duplicate) and to a fresh one 201/200, which ZAP reads as boolean manipulation. app.log shows the uniqueness collisions in the same window. All fund queries are bound JPQL parameters (DonationFundRepository); no SQL is built from input."

[[accepted]]
pluginId = "40018" # SQL Injection (boolean-based heuristic)
param = "name"
uri = '/api/v1/(priests|seva-teams)(/[0-9]+)?$' # create and rename
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec),Same mechanism, not injection: priest and seva team names are unique per trust (uq_priest_name, uq_seva_team_name); ZAP's parallel requests had already created rows named with its payloads, so renaming to one gives 400 (duplicate) and to a fresh one 200, which ZAP reads as boolean manipulation. app.log shows uq_priest_name collisions in the same window. Queries are bound JPQL parameters (PriestRepository, SevaTeamRepository); the duplicate-name race itself was fixed and is pinned by PujaTest/SevakTest concurrent tests."

[[accepted]]
pluginId = "6" # Path Traversal (heuristic): the whole JSON API, guarded by a test
uri = '/api/v1/'
ignoreUntil = 2026-12-31
reason = "Abhi (AppSec), 2026-10-04: the backend makes no filesystem calls at all, so no input can reach a path. ZAP's rule-6 heuristic sends the URL's own last segment ('10', '/receipt', 'donation-funds') as the value of any free-text field; that's valid text, so the request succeeds while ZAP's random comparison value fails validation, and ZAP reports a difference. It flagged a different field each run (title, name, capacity, dakshina, donorAddress...). One entry replaces the per-field ones, and its premise is enforced: NoFilesystemAccessTest fails the build if main code ever uses File/Path/Files/resource loaders, which forces this to be re-reviewed. The startsAt bug this rule found earlier was a validation bug, now covered by EventTest."
