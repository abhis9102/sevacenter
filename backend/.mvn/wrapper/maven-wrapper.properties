# The wrapper downloads Maven and runs it, so the download is pinned like every other build input:
# mvnw refuses to run a zip whose SHA-256 differs (fails closed, also if no hash tool exists).
# On a version bump, take the new hash from a verified download (Apache .sha512 + .asc against
# https://downloads.apache.org/maven/KEYS), never from the same place the zip comes from.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
distributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff
