# Local dev profile: two DB roles (run with SPRING_PROFILES_ACTIVE=local).
# - Flyway/migrations connect as the OWNER (superuser compose role), which runs DDL.
# - The app runtime connects as the least-privilege role 'sevacenter_app', which RLS
#   applies to. The role is created by the docker db-init script (docker/db-init/).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sevacenter}  # trufflehog:ignore — no credentials in URL; creds come from env
    username: ${DB_APP_USERNAME:sevacenter_app}
    password: ${DB_APP_PASSWORD}
  flyway:
    # Local dev only: a long-lived dev database may already have newer migrations from another
    # branch. Never in production, where every migration must apply in version order.
    out-of-order: true
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sevacenter}  # trufflehog:ignore — no credentials in URL; creds come from env
    user: ${DB_USERNAME:sevacenter}
    password: ${DB_PASSWORD}

  # Outgoing email goes to Mailpit (docker compose 'mail'), never to a real inbox.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

# Allow the X-Tenant-Slug header locally (no real subdomains on localhost).
sevacenter:
  tenant:
    allow-header-override: true
  # The Next.js app on <slug>.localhost:3000 (set SEVACENTER_STAFF_URL if you run it on another port).
  public:
    staff-url: ${SEVACENTER_STAFF_URL:http://{slug}.localhost:3000}
    temple-url: ${SEVACENTER_TEMPLE_URL:http://{slug}.localhost:3000}
  mail:
    from: ${SEVACENTER_MAIL_FROM:no-reply@sevacenter.local}

# Local dev runs on plain http, where a Secure cookie would never be sent back.
server:
  servlet:
    session:
      cookie:
        secure: false
