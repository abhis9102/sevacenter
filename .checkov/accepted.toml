ignoreUntil = 2027-01-12
reason = "AppSec (Abhi), 2026-10-14: the permissions boundary is a ceiling, not a grant: each workload role's own policy names its resources. '*' only where the API has no resource (SSM agent channels, ecr:GetAuthorizationToken, log and metric writes)."

