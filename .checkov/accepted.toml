resources = ["aws_iam_policy_document.apply"]
ignoreUntil = 2027-01-12
reason = "AppSec (Abhi), 2026-10-14: ec2:* on the apply role includes ec2:GetPasswordData (Windows only; we run none) and ecr:* includes GetAuthorizationToken for our repositories, which apply needs to manage them. Same bounds as the apply role's other acceptances."

[[accepted]]
